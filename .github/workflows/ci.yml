name: Rust CI

on:
  push:
    branches: [dev, canary, unstable, stable]
  pull_request:
    branches: [dev, canary, unstable, stable]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run tests
        run: cargo test --lib --bin postemberdb
      - name: Build release
        run: cargo build --release
      - name: Compile benchmarks
        run: cargo bench --no-run
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test JDBC driver
        run: mvn -B -f jdbc-driver/pom.xml test

  operator-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check desktop Browser
        run: cargo check --manifest-path tools/browser/Cargo.toml
      - name: Check web Admin
        run: cargo check --manifest-path tools/admin/Cargo.toml
