name: Rust CI

on:
  push:
    branches: [dev, canary, unstable, stable]
  pull_request:
    branches: [dev, canary, unstable, stable]

permissions:
  contents: read

concurrency:
  group: postemberdb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run Clippy correctness and suspicious lints
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run unit and binary tests
        run: cargo test --lib --bin postemberdb
      - name: Run documentation tests
        run: cargo test --doc
      - name: Build release
        run: cargo build --release
      - name: Compile benchmarks
        run: cargo bench --no-run
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test JDBC driver
        run: mvn -B -f jdbc-driver/pom.xml test

  operator-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check desktop Browser
        run: cargo check --manifest-path tools/browser/Cargo.toml
      - name: Check web Admin
        run: cargo check --manifest-path tools/admin/Cargo.toml
      - name: Test web Admin
        run: cargo test --manifest-path tools/admin/Cargo.toml
      - name: Check Admin inline JavaScript
        run: |
          python3 tools/admin/scripts/extract_inline_js.py
          node --check /tmp/postemberdb-admin-inline.js
