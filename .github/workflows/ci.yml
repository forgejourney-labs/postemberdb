name: Rust CI

on:
  push:
    branches: [dev, canary, unstable, stable]
  pull_request:
    branches: [dev, canary, unstable, stable]

permissions:
  contents: read

concurrency:
  group: postemberdb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run Clippy correctness and suspicious lints
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Check all targets
        run: cargo check --all-targets
      - name: Run unit and binary tests
        run: cargo test --lib --bin postemberdb
      - name: Run documentation tests
        run: cargo test --doc
      - name: Build release
        run: cargo build --release
      - name: Compile benchmarks
        run: cargo bench --no-run
