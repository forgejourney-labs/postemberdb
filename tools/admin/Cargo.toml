[package]
name = "postemberdb-admin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Loopback web administration panel for PostemberDB"

[dependencies]
postemberdb = { path = "../.." }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
