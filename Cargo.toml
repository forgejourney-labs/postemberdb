[package]
name = "postemberdb"
version = "0.1.0"
edition = "2021"
description = "An independent Rust-native SQL-like database engine with Embedded and Server modes"
license = "MIT"

[dependencies]
fs2 = "0.4"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = "0.23"
rustls-pemfile = "2.2"
rpassword = "7"

[lib]
name = "postemberdb"
path = "src/lib.rs"

[[bin]]
name = "postemberdb"
path = "src/main.rs"

[[bench]]
name = "minecraft_workload"
harness = false
